[build]
  command = "pnpm build"
  publish = "dist"

# Netlify only auto-serves the site-root /404.html as the default error page;
# without this rule, a broken link under /en/* would fall back to the
# Spanish 404 page instead of the localized English one.
[[redirects]]
  from = "/en/*"
  to = "/en/404/index.html"
  status = 404
